spring.application.name=admissions

# Default profile: in-memory H2 database, so the prototype runs with no setup.
# Use the "mysql" profile (application-mysql.properties) for MySQL.
spring.datasource.url=jdbc:h2:mem:admissions;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true

# FR-03: each document is a PDF of at most 15 MB; one application uploads three.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=50MB

# Private folder for uploaded documents (outside the web root, NFR-01).
app.storage.dir=./data/uploads

# Mail: "log" writes emails to the console; "smtp" sends to spring.mail.host (e.g. a local Mailpit).
app.mail.mode=log
app.mail.from=admissions@auk.edu.ua
#spring.mail.host=localhost
#spring.mail.port=1025

# Set to false to see the warning when the SIS (Team 5) cannot be reached.
app.sis.available=true

# Demo data and the two demo sign-in accounts (test values only).
app.demo-data=true
app.demo.staff-email=staff@auk.edu.ua
app.demo.staff-password=staff-demo-2026
app.demo.applicant-email=applicant@example.com
app.demo.applicant-password=applicant-demo-2026
