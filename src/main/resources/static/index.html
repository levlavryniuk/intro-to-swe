<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AUK Admissions</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">AUK Admissions</a>
  <nav aria-label="Main">
    <a href="/applicant.html">My application</a>
    <a href="/signup.html">Create applicant account</a>
    <a href="/login.html">Sign in</a>
  </nav>
</header>

<main>
  <h1>Study at American University Kyiv</h1>
  <p class="lead-text">Ask the admissions office a question or sign up for an open day or webinar. No account needed.</p>

  <div class="grid-2">
    <!-- UC-1 Submit Inquiry -->
    <section class="card" aria-labelledby="inquiry-title">
      <h2 id="inquiry-title">Send an inquiry</h2>
      <form id="inquiry-form" novalidate>
        <label for="inq-name">Name</label>
        <input id="inq-name" name="name" type="text" autocomplete="name" required>

        <label for="inq-email">Email address</label>
        <input id="inq-email" name="email" type="email" autocomplete="email" required>

        <label for="inq-program">Program of interest</label>
        <select id="inq-program" name="programId" required>
          <option value="">Choose a program</option>
        </select>

        <label for="inq-question">Your question <span class="hint">(optional)</span></label>
        <textarea id="inq-question" name="question" maxlength="2000"></textarea>

        <label class="inline"><input type="checkbox" name="promotionalOptIn"> Send me news and promotional email from AUK</label>

        <div class="actions"><button type="submit">Send inquiry</button></div>
        <div class="msg" id="inquiry-msg" aria-live="polite"></div>
      </form>
    </section>

    <!-- UC-2 Register for Event -->
    <section class="card" aria-labelledby="events-title">
      <h2 id="events-title">Upcoming events</h2>
      <div id="events"><p class="empty">Loading events…</p></div>
    </section>
  </div>
</main>

<template id="event-form-template">
  <form class="event-form" novalidate>
    <label>Name <input name="name" type="text" autocomplete="name" required></label>
    <label>Email address <input name="email" type="email" autocomplete="email" required></label>
    <label class="inline"><input type="checkbox" name="promotionalOptIn"> Send me news and promotional email from AUK</label>
    <div class="actions"><button type="submit">Register</button></div>
    <div class="msg" aria-live="polite"></div>
  </form>
</template>

<script src="/js/api.js"></script>
<script>
  async function loadPrograms() {
    const res = await Api.get('/api/public/programs');
    const select = document.getElementById('inq-program');
    (res.data || []).forEach(p => {
      const option = document.createElement('option');
      option.value = p.id;
      option.textContent = p.name;
      select.appendChild(option);
    });
  }

  document.getElementById('inquiry-form').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target;
    const body = {
      name: form.name.value,
      email: form.email.value,
      programId: form.programId.value ? Number(form.programId.value) : null,
      question: form.question.value,
      promotionalOptIn: form.promotionalOptIn.checked,
    };
    const res = await Api.post('/api/public/inquiries', body);
    if (showResult(form, document.getElementById('inquiry-msg'), res)) {
      form.reset();
    }
  });

  async function loadEvents() {
    const res = await Api.get('/api/public/events');
    const box = document.getElementById('events');
    if (!res.ok || res.data.length === 0) {
      box.innerHTML = '<p class="empty">There are no upcoming events right now. Check back soon.</p>';
      return;
    }
    box.innerHTML = '';
    res.data.forEach(ev => {
      const item = document.createElement('div');
      item.className = 'event';
      const where = ev.location ? esc(ev.location) : 'Online';
      item.innerHTML = '<h3>' + esc(ev.name) + '</h3>'
        + '<div class="when">' + esc(fmtDateTime(ev.startsAt)) + ' · ' + where + '</div>'
        + '<div class="actions"><button class="secondary small" type="button" aria-expanded="false">Register for this event</button></div>';
      const toggle = item.querySelector('button');
      const form = document.getElementById('event-form-template').content.firstElementChild.cloneNode(true);
      form.id = 'event-form-' + ev.id;
      form.classList.add('hidden');
      item.appendChild(form);
      toggle.addEventListener('click', () => {
        const open = form.classList.toggle('hidden') === false;
        toggle.setAttribute('aria-expanded', String(open));
        if (open) form.name.focus();
      });
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const res = await Api.post('/api/public/events/' + ev.id + '/registrations', {
          name: form.name.value, email: form.email.value, promotionalOptIn: form.promotionalOptIn.checked,
        });
        if (showResult(form, form.querySelector('.msg'), res)) form.reset();
      });
      box.appendChild(item);
    });
  }

  loadPrograms();
  loadEvents();
</script>
</body>
</html>
