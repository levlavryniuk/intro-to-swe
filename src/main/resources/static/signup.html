<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Applicant Account</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">AUK Admissions</a>
  <nav aria-label="Main"><a href="/login.html">Sign in</a></nav>
</header>

<main>
  <section class="card" style="max-width:520px;margin:24px auto">
    <h1>Create an applicant account</h1>
    <p class="lead-text">You need an account to submit and follow your application.
      Later this sign-in will come from the shared university platform.</p>
    <form id="signup-form" novalidate>
      <label for="su-name">Full name</label>
      <input id="su-name" name="name" type="text" autocomplete="name" required>
      <label for="su-email">Email address</label>
      <input id="su-email" name="email" type="email" autocomplete="email" required>
      <label for="su-password">Password <span class="hint">(at least 8 characters)</span></label>
      <input id="su-password" name="password" type="password" autocomplete="new-password" required minlength="8">
      <div class="actions"><button type="submit">Create account</button></div>
      <div class="msg" id="signup-msg" aria-live="polite"></div>
    </form>
  </section>
</main>

<script src="/js/api.js"></script>
<script>
  document.getElementById('signup-form').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target;
    const res = await Api.post('/api/public/accounts', {
      name: form.name.value, email: form.email.value, password: form.password.value,
    });
    const msg = document.getElementById('signup-msg');
    if (showResult(form, msg, res)) {
      form.reset();
      msg.innerHTML = 'Your account is ready. <a href="/login.html?signedUp">Sign in</a> to start your application.';
    }
  });
</script>
</body>
</html>
